<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Estudiante</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="box-border min-h-screen bg-sky-100 flex justify-center py-[24px] px-[64px]">
    <div class="w-full max-w-2xl">
      <form 
        id="registroForm" 
        class="flex flex-col p-6 sm:p-8 bg-white border border-slate-200 rounded-xl gap-5 shadow-lg"
      >
        <h2 class="text-2xl font-bold text-center text-slate-800">
          Formulario de Registro
        </h2>
        <p class="text-center text-slate-500 text-sm">
          Complete todos los campos del formulario
        </p>

        <!--Info personal: Nombre, Apellido, Cedula, Género, Fecha de nacimiento-->
        <fieldset class="flex flex-col border border-slate-300 rounded-lg p-6 gap-5 px-4">
          <legend class="text-sm font-semibold text-sky-600">
            Datos personales
          </legend>

          <div class="flex flex-col">
            <label for="nombreForm" class="font-semibold text-slate-800">Nombre</label>
            <input type="text" id="nombreForm" placeholder="Ej: Juan" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="apellidoForm" class="font-semibold text-slate-800">Apellido</label>
            <input type="text" id="apellidoForm" placeholder="Ej: Rodriguez" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="cedulaForm" class="font-semibold text-slate-800">Cedula</label>
            <input type="text" id="cedulaForm" placeholder="Ej: V-123456789 o 123456789" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="fechaNacimientoForm" class="font-semibold text-slate-800">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimientoForm" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col gap-2">
            <span class="font-semibold text-slate-800">Género</span> 
            <label for="masculinoForm" class="text-slate-800 font-semibold text-sm">
              <input type="radio" name="genero" id="masculinoForm" value="Masculino">
              Masculino
            </label>
            <label for="femeninoForm" class="text-slate-800 font-semibold text-sm">
              <input type="radio" name="genero" id="femeninoForm" value="Femenino">
              Femenino
            </label>
          </div>
        </fieldset>

        <!--Info de contacto: Correo, Teléfono, Direccion, Ciudad, Pais-->
        <fieldset class="flex flex-col border border-slate-300 rounded-lg p-6 gap-5 px-4">
          <legend class="text-sm font-semibold text-sky-600">
            Información de Contacto
          </legend>

          <div class="flex flex-col">
            <label for="correoForm" class="font-semibold text-slate-800">Correo electrónico</label>
            <input type="text" id="correoForm" placeholder="Ej: juan@gmail.com" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="telefonoForm" class="font-semibold text-slate-800">Número de teléfono</label>
            <input type="text" id="telefonoForm" placeholder="Ej: +584141234567" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="direccionForm" class="font-semibold text-slate-800">Dirección</label>
            <input type="text" id="direccionForm" placeholder="Ej: Av. 15 con calle 90" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="ciudadForm" class="font-semibold text-slate-800">Ciudad</label>
            <input type="text" id="ciudadForm" placeholder="Ej: Maracaibo, San Francisco, etc." class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="paisForm" class="font-semibold text-slate-800">País</label>
            <select name="paisForm" id="paisForm" class="border border-slate-300 rounded-md p-2">

              <option value="">Seleccione un país</option>
              <option value="Venezuela">Venezuela</option>
              <option value="Colombia">Colombia</option>
              <option value="Argentina">Argentina</option>
              <option value="México">México</option>
              <option value="Chile">Chile</option>
              <option value="Perú">Perú</option>
              <option value="Ecuador">Ecuador</option>
              <option value="España">España</option>
              <option value="Panamá">Panamá</option>
              <option value="República Dominicana">República Dominicana</option>
            </select>
          </div>
        </fieldset>

        <!--Info academica: modalidad de estudio, areas de interés--> 
        <fieldset class="flex flex-col border border-slate-300 rounded-lg p-6 gap-5 px-4">
          <legend class="text-sm font-semibold text-sky-600">
            Información Académica
          </legend>

          <div class="flex flex-col gap-2">
            <span class="font-semibold text-slate-800">Modalidad de estudio</span>
            <label for="onlineForm" class="text-slate-800 font-semibold text-sm">
              <input type="radio" id="onlineForm" name="modalidad" value="Online">
              Online
            </label>
            <label for="presencialForm" class="text-slate-800 font-semibold text-sm">
              <input type="radio" id="presencialForm" name="modalidad" value="Presencial">
              Presencial
            </label>
            <label for="hibridoForm" class="text-slate-800 font-semibold text-sm">
              <input type="radio" id="hibridoForm" name="modalidad" value="Híbrido">
              Híbrido
            </label>
          </div>

          <div class="flex flex-col">
            <span class="font-semibold text-slate-800">
              Areas de interés 
              <span class="text-slate-500 text-sm">(Mínimo 1, máximo 3)</span>
            </span>
            
            
          </div>
        </fieldset>

        <!--Solo para contraseña-->
        <fieldset class="flex flex-col border border-slate-300 rounded-lg p-6 gap-5 px-4">
          <legend class="text-sm font-semibold text-sky-600">
            Seguridad
          </legend>

          <div class="flex flex-col">
            <label for="claveForm" class="font-semibold text-slate-800">Contraseña</label>
            <input type="text" id="claveForm" placeholder="Debe contener mayúsculas, minúsculas, números y caracteres especiales" class="border border-slate-300 rounded-md p-2">
          </div>

          <div class="flex flex-col">
            <label for="validarForm" class="font-semibold text-slate-800">Confirmar contraseña</label>
            <input type="text" id="validarForm" placeholder="Repite la misma contraseña" class="border border-slate-300 rounded-md p-2">
          </div>

        </fieldset>

        <button type="submit" class="bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white rounded-lg py-2 font-semibold shadow-sm">
          Registrarse
        </button>
      </form>
    </div>

  </body>
</html>
